[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diffltm-condgen"
version = "0.1.0"
description = "Continuous diffusion for conditional tabular generation"
authors = [
  {name = "Alankrita Bhatt"},
  {name = "Mukur Gupta"},
  {name = "Andrea Montanari"},
  {name = "Pulkit Tandon"},
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "filelock>=3.20", "torch==2.11.0", "numpy==2.3.5", "pandas==2.3.3", "pyarrow==23.0.1",
  "scipy==1.16.3", "scikit-learn==1.6.1", "hydra-core==1.3.2",
  "omegaconf==2.3.0", "folktables==0.0.12", "ltm-eval==0.1.0",
  "xgboost==3.1.3", "matplotlib==3.10.8"
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pypdf>=6"]

[tool.setuptools.packages.find]
include = ["diffltm*"]

[tool.setuptools.package-data]
"diffltm.data" = ["dgp.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
